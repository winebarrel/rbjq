plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'test/jq/**/*'
    - 'vendor/**/*'
    - 'coverage/**/*'

# The evaluator and the builtins are large case analyses by nature.
Metrics:
  Enabled: false

# Short names (l, r, k, v, ...) are conventional for operands and values.
Naming/MethodParameterName:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

Style/Documentation:
  Enabled: false

# Branches of type dispatches often share a body on purpose.
Lint/DuplicateBranch:
  Enabled: false

# Exact float comparisons are intended in the numeric code (e.g. expm1).
Lint/FloatComparison:
  Enabled: false

# :true / :false name the JSON kinds in the color table.
Lint/BooleanSymbol:
  Enabled: false

# lib/rbjq.rb defines the error classes next to the module API.
Style/OneClassPerFile:
  Enabled: false

# Constants after `private` are fine; they document where they are used.
Lint/UselessConstantScoping:
  Enabled: false

# Exprs (lib/rbjq/expr.rb) build jq code with Ruby operators and blocks
# (x > 0, x % 2 == 0, 1 < x, limit(3) { _1[] }); the numeric and block
# rewrites of these cops would change what the tests build.
Style/NumericPredicate:
  Exclude:
    - 'test/expr_test.rb'
Style/YodaCondition:
  Exclude:
    - 'test/expr_test.rb'
Style/EvenOdd:
  Exclude:
    - 'test/expr_test.rb'
Style/SymbolProc:
  Exclude:
    - 'test/expr_test.rb'
Style/SlicingWithRange:
  Exclude:
    - 'test/expr_test.rb'
Lint/AmbiguousBlockAssociation:
  Exclude:
    - 'test/expr_test.rb'
